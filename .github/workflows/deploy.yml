name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build the project
      run: npm run build

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Add server to known_hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Delete existing dist folder on the server
      run: |
        ssh ${{ secrets.USER }}@${{ secrets.SERVER_IP }} "rm -rf /var/www/electricite.belaidisabri.com/html/*"

    - name: Sync build files to the server
      run: |
        rsync -avz ./dist/ ${{ secrets.USER }}@${{ secrets.SERVER_IP }}:/var/www/electricite.belaidisabri.com/html/

    - name: Restart Nginx
      run: |
        ssh ${{ secrets.USER }}@${{ secrets.SERVER_IP }} "sudo systemctl restart nginx"
